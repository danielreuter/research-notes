# Every spending cap in one file, read by the one budgets guard (`research pods guard --budgets <notes clone>`) and checked by
# `research pods create` (research.pods.budgets). A line is the approval. Migrated 2026-09-29T08:50Z by the research coordinator
# from the per-prefix guards on vy-control-verity: each cap_usd is that guard's cap less what it had spent. The per-prefix guards
# keep running to their deadlines, because this guard never terminates on the clock and these pods were created without leases.

[guard]
project = ["vy-", "vyv-rf-epoch-", "vyv-cov-"]   # vyv-rf-epoch-: the vLLM follow-up epoch only; vyv-cov-: the vLLM config-sweep coverage; other vyv- pods keep the fleet guard (/root/dm)                  # vy- pods only; the vLLM fleet's vyv- pods keep their own guard (/root/dm/CAP)
