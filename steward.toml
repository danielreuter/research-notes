# Read by `research notes watch` every pass (steward rules, notes.py). Renders run once per UTC day per entry.
# source: the cli worktree (sparse, detached at main; the coordinator moves it after each merge).

[[render]]
at = "13:00Z"
source = "/workspace/steward/render-src"   # its own checkout at main, refreshed before each render; the steward checkout also serves the guards and trains
out = "/workspace/steward/renders/daily"   # outside the notes: renders are never committed
store = "/workspace/steward/store"
published = "entities"   # the site's JSON + the internal parity gate; markdown retired (Daniel 2026-09-26)

